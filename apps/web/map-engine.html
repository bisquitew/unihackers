<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hop map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root { --hub-bottom: 0px; --ink: #1A1033; --muted: #5A5070; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #E4DEF0; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  html[data-theme="golden"], html[data-theme="golden"] body { background: #F1E7E0; }
  html[data-theme="night"], html[data-theme="night"] body { background: #14091F; }
  #map { position: absolute; inset: 0; touch-action: none; }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { margin-bottom: var(--hub-bottom); }
  .maplibregl-ctrl-attrib { font: 500 11px/1.3 system-ui, sans-serif; border-radius: 12px 12px 12px 12px; }

  /* pins: a white disc with the kind's flat illustration inside and a small pointer (the identity retired arches around marks) */
  /* MapLibre positions markers with position:absolute + transform. Never override either on the marker element itself. */
  .maplibregl-marker.pin { position: absolute; top: 0; left: 0; }
  .pin { width: 48px; height: 56px; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; }
  .pin .disc { position: absolute; left: 2px; top: 0; width: 44px; height: 44px; border-radius: 50%; background: #fff; z-index: 2;
    display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(26,16,51,.08), 0 2px 4px rgba(26,16,51,.10), 0 8px 16px -6px rgba(26,16,51,.32);
    transition: transform .16s cubic-bezier(.3,1.5,.5,1), box-shadow .16s ease-out; transform-origin: 50% 100%; }
  .pin .tip { position: absolute; left: 18px; top: 36px; width: 12px; height: 12px; background: #fff; border-radius: 2px; transform: rotate(45deg); z-index: 1;
    box-shadow: 1px 1px 0 0 rgba(26,16,51,.08), 3px 4px 8px -3px rgba(26,16,51,.25); }
  .pin .foot { position: absolute; left: 15px; bottom: 0; width: 18px; height: 5px; border-radius: 50%; background: rgba(26,16,51,.20); filter: blur(2px); z-index: 0; }
  .pin .badge { position: absolute; right: -1px; top: -1px; width: 18px; height: 18px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(26,16,51,.10); z-index: 3; }
  .pin.selected { z-index: 5; }
  .pin.selected .disc { transform: scale(1.15); box-shadow: 0 0 0 3px var(--ink), 0 12px 20px -8px rgba(26,16,51,.45); }
  .pin:focus-visible .disc { outline: 3px solid var(--ink); outline-offset: 2px; }
  html[data-theme="night"] .pin .disc { box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 0 16px rgba(255,185,102,.35), 0 8px 16px -6px rgba(0,0,0,.6); }
  html[data-theme="night"] .pin.selected .disc { box-shadow: 0 0 0 3px #FFD9A8, 0 0 22px rgba(255,185,102,.5); }
  /* you are here: a blue dot with a soft pulse; when the phone knows which way you face it becomes a navigation arrow */
  .me { width: 44px; height: 44px; position: relative; pointer-events: none; }
  .me .halo { position: absolute; inset: 0; border-radius: 50%; background: rgba(61,91,255,.2); animation: me-pulse 2.4s ease-out infinite; }
  .me .dot { position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; border-radius: 50%; background: #3D5BFF; box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(26,16,51,.35); }
  .me .arrow { position: absolute; inset: 0; display: none; }
  .me .arrow svg { width: 44px; height: 44px; display: block; filter: drop-shadow(0 2px 4px rgba(26,16,51,.35)); }
  .me.has-heading .arrow { display: block; }
  .me.has-heading .dot { display: none; }
  @keyframes me-pulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.15); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .me .halo { animation: none; opacity: .5; } }

  /* offline notice */
  #offline { position: absolute; left: 16px; right: 16px; top: 96px; margin: 0 auto; max-width: 360px; padding: 12px 14px; border-radius: 18px;
    background: #fff; color: var(--ink); font: 600 14px/20px system-ui, sans-serif; box-shadow: 0 10px 30px -10px rgba(26,16,51,.35); display: flex; gap: 12px; align-items: center; z-index: 10; }
  #offline[hidden] { display: none; }
  #offline span { flex: 1; font-weight: 500; color: var(--muted); }
  #offline button { border: 0; border-radius: 999px; height: 40px; padding: 0 16px; background: #FF3D7F; color: #1A1033; font: 700 15px system-ui, sans-serif; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .pin .disc { transition: none; } }
</style>
</head>

<script>/* hop city style for MapLibre GL JS, over OpenFreeMap (OpenMapTiles schema).
   The map is a quiet stage in the brand's look (docs/brand/identity.md): near-white ground, white buildings with soft
   ink shading, mint and blue only for parks and water. The colour comes from the pins and illustrations on top of it.
   Runs inside the map WebView/iframe. Exposes window.HubStyle = { buildStyle, themeForNow, sunAltitude }. */

      road: '#FFD9A8', roadCasing: 'rgba(255,217,168,0.0)', rail: 'rgba(108,132,255,0.65)', glow: '#FFB866',
      bldLow: '#2A1B49', bldHigh: '#3E2D68', bldFlat: '#241540',
      label: '#F8F6FB', labelMuted: '#B9A8DD', halo: '#14091F',

    day:    { wall: ['#F2DCC2', '#D6C8F4', '#C3D1FB', '#FFCFAF', '#E2DCEC'], plinth: ['#DDC19F', '#BFAEE8', '#A9BDF2', '#F2B58F', '#CBC2DA'], roof: ['#EDBBA2', '#CFC6E8', '#EBD6B8', '#BFCDF4', '#E3BFB4'] },
    golden: { wall: ['#F5D9BC', '#E3CBE3', '#D5CEF0', '#FFC9A3', '#E8DACB'], plinth: ['#E2BE98', '#CCAECC', '#BBB2E0', '#F2AE86', '#D3C0AD'], roof: ['#E9B08F', '#C9BADF', '#E8CFA8', '#B5BFEA', '#DDB1A0'] },

  };
  var N_TINTS = 5;

  function tintMatch(list) { return ['match', VARIANT, 0, list[0], 1, list[1], 2, list[2], 3, list[3], list[4]]; }
  var PLINTH_H = ['min', 3.5, ['*', BLD_H, 0.4]];

    day:    { top: '#C8D6FF', bottom: '#9DB0F0', lit: 0, litTop: '#C8D6FF', litBottom: '#9DB0F0' },

    night:  { top: '#241C4A', bottom: '#181238', lit: 0.5, litTop: '#FFE2B5', litBottom: '#FFB866' }
  };

  }

    var c = document.createElement('canvas'); c.width = S; c.height = S;
    var g = c.getContext('2d');

    var c = document.createElement('canvas'); c.width = S; c.height = S;

        var x = col * 24 + 4, y = y0 + 5;
        var grad = g.createLinearGradient(0, y, 0, y + 14);

        g.fillStyle = grad; roundRect(g, x, y, 16, 14, 3); g.fill();

          g.fillStyle = 'rgba(255,255,255,0.28)'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 9, y); g.lineTo(x, y + 9); g.closePath(); g.fill();

  // buildings fade in/out with zoom instead of changing height, so nothing pops
  function fade(a, b) { return ['interpolate', ['linear'], ['zoom'], a, 0, b, 1]; }

  var ROAD_CLASSES =['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor', 'service'];

  var NAME = ['coalesce', ['get', 'name:latin'], ['get', 'name']];

  /* ---------- points of interest: landmarks, public drinking fountains and a few useful services ----------
     The map data holds thousands of POIs (parking, bollards, litter bins...). Only the useful groups are drawn, each
     revealed at the zoom where it stops being clutter. Icons are painted on a canvas (see poiImage), no image files.
     Colour follows the app's hue-by-meaning: blue = getting around and water, mint = health and services, a ringed
     star = a landmark worth a look, a small plain dot = food and shops. */
  var POI_DOT = ['restaurant', 'cafe', 'bar', 'fast_food', 'bakery', 'grocery'];
  var POI_HEALTH = ['pharmacy', 'hospital', 'dentist', 'doctors'];

        filter: ['in', ['get', 'class'], ['literal', ['suburb', 'quarter', 'neighbourhood']]], minzoom: 12.5, maxzoom: 16,
        layout: { 'text-field': NAME, 'text-font': ['Noto Sans Bold'], 'text-size': 12, 'text-transform': 'none', 'text-letter-spacing': 0.04, 'text-max-width': 7 },
        paint: { 'text-color': t.labelMuted, 'text-halo-color': t.halo, 'text-halo-width': 1.6 } },
      { id: 'place-city', type: 'symbol', source: 'ofm', 'source-layer': 'place',
        filter: ['in', ['get', 'class'], ['literal', ['city', 'town']]],
        layout: { 'text-field': NAME, 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 8, 13, 14, 20], 'text-max-width': 8 },
        paint: { 'text-color': t.label, 'text-halo-color': t.halo, 'text-halo-width': 2 } }
    );

    return {
      version: 8,
      name: 'hop-' + themeName,
      glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
      sources: {
        ofm: {
          type: 'vector',
          url: 'https://tiles.openfreemap.org/planet',
          attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
        }
      },
      sky: {
        'sky-color': t.sky, 'horizon-color': t.horizon, 'fog-color': t.fog,
        'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.7, 'fog-ground-blend': 0.55
      },
      light: { anchor: 'map', color: t.light.color, intensity: t.light.intensity, position: t.light.position },
      layers: layers
    };
  }

  /* Solar altitude (degrees) for Timisoara. Used for the automatic day / golden hour / night theme. */
  function sunAltitude(date) {
    var rad = Math.PI / 180, lat = 45.7489, lon = 21.2087;
    var d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
    var g = (357.529 + 0.98560028 * d) % 360;
    var q = (280.459 + 0.98564736 * d) % 360;
    var L = q + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad);
    var e = 23.439 - 0.00000036 * d;
    var ra = Math.atan2(Math.cos(e * rad) * Math.sin(L * rad), Math.cos(L * rad)) / rad;
    var dec = Math.asin(Math.sin(e * rad) * Math.sin(L * rad)) / rad;
    var gmst = (18.697374558 + 24.06570982441908 * d) % 24;
    var lst = (gmst * 15 + lon) % 360;
    var ha = (lst - ra) * rad;
    return Math.asin(Math.sin(lat * rad) * Math.sin(dec * rad) + Math.cos(lat * rad) * Math.cos(dec * rad) * Math.cos(ha)) / rad;
  }

  /* The automatic theme. Night is a clock-time choice (22:00 to 06:00 on the phone's clock), not the moment the sun sets:
     in winter the sun is down by 17:00, and a dark map at tea time feels like a bug. The rest of the day follows the sun:
     day while it is high, the warm golden look for the low sun and for the evening and early morning hours. */
  var NIGHT_FROM_HOUR = 22;
  var NIGHT_UNTIL_HOUR = 6;
  function themeForNow(date) {
    var now = date || new Date();
    var hour = now.getHours();
    if (hour >= NIGHT_FROM_HOUR || hour < NIGHT_UNTIL_HOUR) return 'night';
    return sunAltitude(now) > 12 ? 'day' : 'golden';
  }

  window.HubStyle = { buildStyle: buildStyle, themeForNow: themeForNow, sunAltitude: sunAltitude, themes: THEMES, wallImage: wallImage, groundImage: groundImage, roofImage: roofImage, poiImage: poiImage };
})();
</script>
<script>/* hop map engine. Runs inside the WebView (native) or iframe (web) and talks to the app through a tiny message bridge.
   App -> engine: setPins, flyTo, setCity, select, setTheme, setReducedMotion, setInsets, setUserLocation
   Engine -> app: ready, pinPress, longPress, tap, camera, error                                          */
(function () {
  var ART = window.__PIN_ART__ || {};
  var START = { center: [21.2272, 45.7537], zoom: 15.4 };
  var palette = 'vivid'; // flat-skin day palette: 'vivid' (default) | 'mono' | 'soft'
  var skin = 'flat'; // 'flat' (2D, default) or 'city3d'
  function skinPitch() { return skin === 'flat' ? 0 : 45; }
  function skinBearing() { return skin === 'flat' ? 0 : -15; }
  var BOUNDS = [[20.9, 45.55], [21.55, 45.95]]; // replaced by the app's city (setCity)

  var map = null;
  var loaded = false;
  var queue = [];
  var themeSetting = 'auto';
  var activeTheme = null;
  var reduceMotion = false;
  var insets = { top: 0, right: 0, bottom: 0, left: 0 };
  var pins = {}; // id -> { data, marker, el }
  var selectedId = null;
  var userMarker = null;

  function send(msg) {
    try {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      else if (window.parent && window.parent !== window) window.parent.postMessage({ hubMap: true, msg: msg }, '*');
    } catch (e) { /* bridge not ready */ }
  }

  /* ---------- pins ---------- */
  function pinHtml(p) {
    var art = ART[p.art] || ART.note || '';
    var badge = p.badge === 'shared'
      ? '<span class="badge" title="Shared"><svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><circle cx="5.5" cy="6" r="2.4" fill="#1A1033"/><circle cx="11" cy="6.6" r="2" fill="#1A1033"/><path d="M1.5 13a4 4 0 0 1 8 0Z M8 13a3.2 3.2 0 0 1 6.4 0Z" fill="#1A1033"/></svg></span>'
      : p.badge === 'lock'
      ? '<span class="badge" title="Private"><svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" fill="#1A1033"/><path d="M5.2 7V5.4a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="#1A1033" stroke-width="1.6"/></svg></span>'
      : '';
    return '<span class="tip"></span><span class="disc"><svg viewBox="0 0 56 56" width="28" height="28" aria-hidden="true">' + art + '</svg></span>' + badge + '<span class="foot"></span>';
  }

  function makeMarker(p) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'pin' + (p.id === selectedId ? ' selected' : '');
    el.setAttribute('aria-label', p.title + (p.kindLabel ? ', ' + p.kindLabel : ''));
    el.innerHTML = pinHtml(p);
    el.addEventListener('click', function (ev) { ev.stopPropagation(); send({ type: 'pinPress', id: p.id }); });
    var marker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([p.lng, p.lat]).addTo(map);
    return { data: p, marker: marker, el: el };
  }

  function setPins(list) {
    var next = {};
    list.forEach(function (p) { next[p.id] = p; });
    Object.keys(pins).forEach(function (id) {
      if (!next[id]) { pins[id].marker.remove(); delete pins[id]; }
    });
    list.forEach(function (p) {
      var cur = pins[p.id];
      if (!cur) { pins[p.id] = makeMarker(p); return; }
      var changed = cur.data.title !== p.title || cur.data.art !== p.art || cur.data.badge !== p.badge || cur.data.kindLabel !== p.kindLabel;
      if (cur.data.lng !== p.lng || cur.data.lat !== p.lat) cur.marker.setLngLat([p.lng, p.lat]);
      if (changed) {
        cur.el.innerHTML = pinHtml(p);
        cur.el.setAttribute('aria-label', p.title + (p.kindLabel ? ', ' + p.kindLabel : ''));
      }
      cur.data = p;
    });
  }

  function select(id) {
    if (selectedId && pins[selectedId]) pins[selectedId].el.classList.remove('selected');
    selectedId = id || null;
    if (selectedId && pins[selectedId]) {
      pins[selectedId].el.classList.add('selected');
      pins[selectedId].marker.getElement().style.zIndex = 5;
    }
  }

  /* ---------- camera ---------- */
  function flyTo(c) {
    var opts = { center: [c.lng, c.lat], padding: insets };
    if (typeof c.zoom === 'number') opts.zoom = c.zoom;
    if (typeof c.pitch === 'number') opts.pitch = c.pitch;
    if (typeof c.bearing === 'number') opts.bearing = c.bearing;
    if (reduceMotion || c.instant) map.jumpTo(opts);
    else { opts.duration = 900; opts.essential = false; map.easeTo(opts); }
  }

  function setInsets(i) {
    insets = { top: i.top || 0, right: i.right || 0, bottom: i.bottom || 0, left: i.left || 0 };
    document.documentElement.style.setProperty('--hub-bottom', insets.bottom + 'px');
    if (map) map.setPadding(insets);
  }

  /* ---------- theme ---------- */
  function resolveTheme() { return themeSetting === 'auto' ? HubStyle.themeForNow(new Date()) : themeSetting; }
  function setSkin(next) {
    next = next === 'city3d' ? 'city3d' : 'flat';
    if (next === skin) return;
    skin = next;
    if (!map) return;
    map.setMaxPitch(skin === 'flat' ? 0 : 70);
    map.setStyle(HubStyle.buildStyle(activeTheme || resolveTheme(), skin, palette));
    map.easeTo({ pitch: skinPitch(), bearing: skinBearing(), duration: reduceMotion ? 0 : 600 });
  }
  function applyTheme(force) {
    var next = resolveTheme();
    if (!force && next === activeTheme) return;
    activeTheme = next;
    document.documentElement.setAttribute('data-theme', next);
    if (map) map.setStyle(HubStyle.buildStyle(next, skin, palette));
  }

  /* ---------- user location dot ---------- */
  var meEl = null;
  var meHeading = null; // degrees clockwise from north, or null when unknown
  // the arrow points where you face on the real world, so it is turned against the map's own rotation
  function paintMe() {
    if (!meEl) return;
    var known = typeof meHeading === 'number';
    meEl.classList.toggle('has-heading', known);
    if (known) meEl.querySelector('.arrow').style.transform = 'rotate(' + (meHeading - map.getBearing()) + 'deg)';
  }
  function setUserLocation(p) {
    if (!p) { if (userMarker) { userMarker.remove(); userMarker = null; meEl = null; } return; }
    meHeading = typeof p.heading === 'number' ? p.heading : null;
    if (!userMarker) {
      meEl = document.createElement('div');
      meEl.className = 'me';
      meEl.setAttribute('aria-label', 'Your location');
      meEl.innerHTML = '<div class="halo"></div><div class="dot"></div><div class="arrow"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M22 6 L34.5 34 Q35.4 36.4 33 35.4 L22 30.4 L11 35.4 Q8.6 36.4 9.5 34 Z" fill="#3D5BFF" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>';
      userMarker = new maplibregl.Marker({ element: meEl }).setLngLat([p.lng, p.lat]).addTo(map);
    } else userMarker.setLngLat([p.lng, p.lat]);
    paintMe();
  }

  /* ---------- long press ---------- */
  var press = null;
  function startPress(e) {
    cancelPress();
    var pt = e.point;
    press = { x: pt.x, y: pt.y, ll: e.lngLat, t: setTimeout(function () {
      if (!press) return;
      send({ type: 'longPress', lat: press.ll.lat, lng: press.ll.lng });
      press = null;
    }, 550) };
  }
  function movePress(e) {
    if (!press) return;
    var dx = e.point.x - press.x, dy = e.point.y - press.y;
    if (dx * dx + dy * dy > 64) cancelPress();
  }
  function cancelPress() { if (press) { clearTimeout(press.t); press = null; } }

  /* ---------- offline / errors ---------- */
  var errorTimer = null;
  function showOffline(on) { var n = document.getElementById('offline'); if (n) n.hidden = !on; }

  /* ---------- commands ---------- */
  function handle(msg) {
    if (!msg || !msg.type) return;
    if (!loaded && msg.type !== 'setTheme' && msg.type !== 'setReducedMotion' && msg.type !== 'setInsets') { queue.push(msg); return; }
    switch (msg.type) {
      case 'setPins': setPins(msg.pins || []); break;
      case 'flyTo': flyTo(msg); break;
      case 'setCity': // the city this map shows: where it opens and how far it can be dragged
        START = { center: [msg.lng, msg.lat], zoom: msg.zoom };
        BOUNDS = msg.bounds;
        if (map) { map.setMaxBounds(BOUNDS); map.jumpTo({ center: START.center, zoom: START.zoom }); }
        break;
      case 'select': select(msg.id); break;
      case 'setTheme': themeSetting = msg.theme || 'auto'; if (map) applyTheme(false); break;
      case 'setReducedMotion': reduceMotion = !!msg.value; break;
      case 'setInsets': setInsets(msg); break;
      case 'setUserLocation': setUserLocation(msg.location); break;
      case 'retry': showOffline(false); if (map) map.setStyle(HubStyle.buildStyle(activeTheme || resolveTheme(), skin, palette)); break;
      case 'setSkin': setSkin(msg.skin); break;
      case 'setPalette': palette = msg.palette || 'soft'; if (map) map.setStyle(HubStyle.buildStyle(activeTheme || resolveTheme(), skin, palette)); break;
    }
  }

  window.__hubMap = { receive: function (json) { try { handle(typeof json === 'string' ? JSON.parse(json) : json); } catch (e) { send({ type: 'error', message: String(e) }); } } };
  window.addEventListener('message', function (ev) { var d = ev.data; if (d && d.hubMapCmd) window.__hubMap.receive(d.hubMapCmd); });
  document.addEventListener('message', function (ev) { window.__hubMap.receive(ev.data); }); // Android WebView

  /* ---------- boot ---------- */
  function boot() {
    if (!window.maplibregl) { document.getElementById('offline').hidden = false; send({ type: 'error', message: 'maplibre failed to load' }); return; }
    activeTheme = resolveTheme();
    document.documentElement.setAttribute('data-theme', activeTheme);
    map = new maplibregl.Map({
      container: 'map',
      style: HubStyle.buildStyle(activeTheme, skin, palette),
      center: START.center, zoom: START.zoom, pitch: skinPitch(), bearing: skinBearing(),
      maxPitch: skin === 'flat' ? 0 : 70, minZoom: 11.5, maxZoom: 19, maxBounds: BOUNDS,
      attributionControl: false,
      canvasContextAttributes: { antialias: true },
      dragRotate: true, touchPitch: true, pitchWithRotate: true
    });
    // facade textures are painted on demand: the style asks for 'hop-wall-<theme>-<n>'
    map.on('styleimagemissing', function (ev) {
      var m = /^hop-wall-(day|golden|night)-([0-9]+)$/.exec(ev.id);
      if (m && !map.hasImage(ev.id)) map.addImage(ev.id, HubStyle.wallImage(m[1], parseInt(m[2], 10)), { pixelRatio: 1.5 });
    });
    map.on('styleimagemissing', function (ev) {
      var g = /^hop-(ground|park)-(day|golden|night)$/.exec(ev.id);
      if (g && !map.hasImage(ev.id)) map.addImage(ev.id, HubStyle.groundImage(g[1], g[2]), { pixelRatio: 2 });
    });
    map.on('styleimagemissing', function (ev) {
      var rf = /^hop-roof-(day|golden|night)-([0-9]+)$/.exec(ev.id);
      if (rf && !map.hasImage(ev.id)) map.addImage(ev.id, HubStyle.roofImage(rf[1], parseInt(rf[2], 10)), { pixelRatio: 2 });
    });
    map.on('styleimagemissing', function (ev) {
      var p = /^hop-poi-(landmark|fountain|health|transit|dot)$/.exec(ev.id);
      if (p && !map.hasImage(ev.id)) map.addImage(ev.id, HubStyle.poiImage(p[1]), { pixelRatio: 2 });
    });
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
    map.on('rotate', paintMe);
    map.touchZoomRotate.enableRotation();

    map.on('load', function () {
      loaded = true;
      send({ type: 'ready', theme: activeTheme });
      var q = queue; queue = [];
      q.forEach(handle);
    });
    map.on('click', function (e) { send({ type: 'tap', lat: e.lngLat.lat, lng: e.lngLat.lng }); });
    map.on('mousedown', startPress); map.on('touchstart', startPress);
    map.on('mousemove', movePress); map.on('touchmove', movePress);
    ['mouseup', 'touchend', 'touchcancel', 'movestart', 'zoomstart', 'dragstart'].forEach(function (n) { map.on(n, cancelPress); });
    var idle = null;
    map.on('moveend', function () {
      clearTimeout(idle);
      idle = setTimeout(function () {
        var c = map.getCenter();
        send({ type: 'camera', lat: c.lat, lng: c.lng, zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() });
      }, 250);
    });
    map.on('error', function (e) {
      var m = (e && e.error && e.error.message) || 'map error';
      if (/Failed to fetch|NetworkError|Load failed|Not allowed|403|404/i.test(m)) {
        clearTimeout(errorTimer);
        errorTimer = setTimeout(function () { showOffline(true); send({ type: 'error', message: m }); }, 1500);
      }
    });
    map.on('data', function (e) { if (e && e.dataType === 'source' && e.isSourceLoaded) { clearTimeout(errorTimer); showOffline(false); } });
    setInterval(function () { if (themeSetting === 'auto') applyTheme(false); }, 5 * 60 * 1000);
    document.getElementById('retry').addEventListener('click', function () { handle({ type: 'retry' }); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
