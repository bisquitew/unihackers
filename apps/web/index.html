<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hop</title>
  <meta name="description" content="Live alerts, parking, events and your neighbours in your city. Look around, then log in to join in.">
  <meta property="og:title" content="hop">
  <meta property="og:description" content="Your city, in one place: live alerts, parking, events and people to go with.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script>
    // set the theme before first paint so there is no light flash in dark mode
    (function () {
      var s = localStorage.getItem('hop_theme') || 'system';
      var dark = s === 'dark' || (s === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="navbarContainer"></div>
  <div id="menuHost"></div>
  <main id="mainContent"></main>
  <div id="modalContainer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
