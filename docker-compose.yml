version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-timisoara-hub.eu.auth0.com}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-https://api.timisoara-hub.ro}
      - DATABASE_URL=${DATABASE_URL:-}
      - VULTR_STORAGE_KEY=${VULTR_STORAGE_KEY:-}
      - VULTR_STORAGE_SECRET=${VULTR_STORAGE_SECRET:-}
      - VULTR_STORAGE_BUCKET=${VULTR_STORAGE_BUCKET:-timisoara-hub-media}
      - VULTR_STORAGE_REGION=${VULTR_STORAGE_REGION:-fra1}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  workers:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    environment:
      - API_BASE_URL=http://api:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AUTH_TOKEN=dev_ai_agent
      - INGESTION_INTERVAL_MS=600000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
